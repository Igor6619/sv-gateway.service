location /api/v1/sbz/ {
    set $sbz_backend http://sbz:80;
    
    
    # rewrite ^/api/v1/sbz/(.*) /$1 break;
    # Здесь слэш НЕ НУЖЕН, rewrite уже всё сделал
    proxy_pass $sbz_backend;

    

    # Твои заголовки
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URI $request_uri;
}

location /api/v1/static/ {
    set $sbz_backend http://sbz:80;
    
    # ✂️ Отрезаем /api/v1/ и передаем внутрь контейнера чистый путь /static/...
    rewrite ^/api/v1/(.*) /$1 break;
    
    proxy_pass $sbz_backend;

    # Стандартные заголовки для статики
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

