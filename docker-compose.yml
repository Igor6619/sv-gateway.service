version: '3.8'

services:
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"   # Открываем наружу стандартный HTTP-порт
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Монтируем конфиг в режиме "только чтение"
      - ./routes:/etc/nginx/routes:ro # Пробрасываем папку с маршрутами
    networks:
      - global-api-network
    restart: unless-stopped  # Чтобы шлюз автоматически перезапускался при сбое или перезагрузке сервера

networks:
  global-api-network:
    external: true
    name: api-network  # Подключаемся к ранее созданной сети api-network