events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format gateway_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           'to: $upstream_addr';
    access_log /var/log/nginx/access.log gateway_log;

    server {
        listen 80;
        server_name localhost;
        server_tokens off;

        resolver 127.0.0.11 valid=5s;

        # Автоматически импортируем все конфигурации маршрутов из папки routes
        include /etc/nginx/routes/*.conf;

        # Заглушка для неизвестных путей (всегда должна быть в самом конце)
        location / {
            return 404 '{"status": 404, "message": "API route not found"}';
            add_header Content-Type application/json;
        }
    }
}
